[project]
name = "home-network-monitor-backend"
version = "0.1.0"
description = "Backend for the Home Network Monitoring System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.139.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
